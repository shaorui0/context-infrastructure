apiVersion: batch/v1
kind: Job
metadata:
  annotations:
    meta.helm.sh/release-name: dv-liquibase
    meta.helm.sh/release-namespace: qa-security
  labels:
    app.kubernetes.io/managed-by: Helm
  name: dv-liquibase
  namespace: qa-security
spec:
  backoffLimit: 2
  completionMode: NonIndexed
  completions: 1
  parallelism: 1
  podReplacementPolicy: TerminatingOrFailed
  template:
    spec:
      containers:
      - env:
        - name: LIQUIBASE_HOST
          value: fp-mysql          # FIX: was 172.27.44.126 (hit dead :3306); fp-mysql Service DNATs 3306 -> 52200
        - name: LIQUIBASE_DATABASE
          value: risk
        - name: LIQUIBASE_USERNAME
          value: root
        - name: LIQUIBASE_PASSWORD
          value: password
        - name: ACTIVE_TENANTS
        - name: LIQUIBASE_LOGLEVEL
          value: info
        - name: PARALLELISM
        image: docker-registry.dv-api.com/cloud/dv-liquibase:DV.202602AM1.External.weeklyhotfix_DAPP5225-ce08b33
        imagePullPolicy: Always
        name: dv-liquibase
        resources: {}
        terminationMessagePath: /dev/termination-log
        terminationMessagePolicy: File
      dnsPolicy: ClusterFirst
      imagePullSecrets:
      - {}
      restartPolicy: Never
      schedulerName: default-scheduler
      securityContext: {}
      terminationGracePeriodSeconds: 30
