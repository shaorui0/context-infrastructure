<template id="w-cs-doris-en">
<article>
  <div class="kick eyebrow" style="color:var(--amber)">Case Study · Featured</div>
  <h1>Rebuilding a 5-Billion-Row, 3,700-Column Fraud Event Store, Down to the Engine</h1>
  <p class="standfirst">ClickHouse → Apache Doris compute-storage separation. Infra-side owner, end to end: engine selection, migration pipeline, engine-level query routing, elasticity, observability.</p>
  <div class="tags"><span class="chip">data &amp; state</span><span class="chip">distributed systems</span><span class="chip">platform</span><span class="chip">incidents</span></div>

  <h2>The one-paragraph version</h2>
  <p>Our fraud-analytics event layer serves two increasingly conflicting workloads: millisecond point lookups on the serving path, and a growing stream of unpredictable ad-hoc analytics — increasingly generated by AI-agent-facing product features rather than human analysts. The old ClickHouse shared-nothing layer could neither isolate the second workload nor scale for it: one heavy query starves the shared pool, and we measured a <code>SELECT * LIMIT 10</code> that waited <span class="fig">61 s</span> of wall-clock on <span class="fig">60 ms</span> of CPU, queued behind a bulk insert. What I did was not a migration. I rebuilt this layer on compute-storage separation — Apache Doris shared-data mode with Iceberg on S3, on Kubernetes — and built query routing into the Doris frontend itself, so the system classifies every query heavy/light in <span class="fig">6–8 ms</span> before execution and drives a spot compute pool from zero to N and back. The move was certified <span class="fig">99.945%</span> row-complete over <span class="fig">~5.2B rows / ~4 TiB / up to ~3,700 columns</span>; point-lookup latency went from <span class="fig">~8 s to ~20 ms</span>, proven flat across 19× data growth; and along the way I root-caused a chain of engine-level failures, from a Parquet footer explosion that OOMed every backend on a bare <code>COUNT(*)</code> to a compaction death spiral driven by a 46× compression collapse.</p>

  <h2>Why we left ClickHouse (it was still faster)</h2>
  <p>ClickHouse was winning flat-table scans by <span class="fig">1.2–2.5×</span> on our own primary-source benchmarks when we decided to leave it. The migration case was structural, and it took discipline to keep it that way, because "the new engine is faster" is the story everyone wants to tell and the one that falls apart under cross-examination.</p>
  <p>Four compromises drove the decision:</p>
  <ol>
    <li><strong>No workload isolation.</strong> One heavy query starves a shared node — the 61 s / 60 ms starvation case above was routine, not exceptional.</li>
    <li><strong>Rigid, always-on compute.</strong> Shared-nothing couples compute to local disk. Idle periods and heavy-query bursts pay for the same resident hardware. Genuinely stateless elastic compute exists in the ClickHouse ecosystem only as a closed-source managed service; that is an architecture gap, not a configuration gap.</li>
    <li><strong>Fragile wide-schema evolution.</strong> Per-tenant schemas evolve dynamically and land as thousands of sparse columns, maintained by brittle <code>ALTER ADD COLUMN</code>.</li>
    <li><strong>Sampling as a correctness tax.</strong> Analytical queries defaulted to a 1M-row sample because full scans were too expensive — trading correct answers for latency.</li>
  </ol>
  <p>The load-bearing argument, and the one that survives even the newest ClickHouse releases, is <strong>hard memory isolation</strong>: Doris workload groups enforce cgroup-backed hard limits per query pool, where ClickHouse's equivalents remain best-effort. When an AI-agent-facing product layer started generating unpredictable query shapes at unpredictable rates, isolation and elasticity stopped being nice-to-haves.</p>

  <h2>Target architecture</h2>
  <p>Doris 4.0.5 in shared-data mode: tablet data lives in an S3 storage vault, metadata in MetaService backed by FoundationDB, and backends are stateless compute with local EBS acting only as file cache. Compute is physically partitioned into <strong>compute groups</strong> — a resident serving pool on on-demand nodes, and an elastic heavy pool on spot instances that rests at zero replicas. Within each pool, <strong>workload groups</strong> govern CPU, memory, and concurrency. Iceberg on the same S3 serves as the open lake tier.</p>
  <p>The design insight worth stating explicitly: compute-storage separation does not remove state. It concentrates state into one layer (MetaService, FoundationDB, the S3 recycler) — and that layer is precisely where you can no longer cut corners. Three new stateful failure domains replaced "disks attached to every node," and the operational work below reflects that trade.</p>

  <h2>The migration was a memory-engineering problem</h2>
  <p>A ~3,700-column table breaks the naive "export to Parquet, bulk load" path in four places, none of them obvious, and adding hardware fixes none of them:</p>
  <ul>
    <li><strong>The footer bomb.</strong> A Parquet footer scales with <code>row_groups × columns</code>. Our early objects carried a <span class="fig">2.12 GB</span> footer; the reader OOMed all eight backends before touching a single row of data. The tell: even a bare <code>COUNT(*)</code> died — proof that metadata parsing, not data scanning, was exploding. Fix: restructure the objects, footer down ~9×.</li>
    <li><strong>The untracked scanner.</strong> Doris's vectorized Parquet column reader allocates outside <code>exec_mem_limit</code>. Memory scales with <code>scanner_concurrency × columns</code>; at defaults that was <span class="fig">~78 GB</span> per backend. No query-level memory limit helps a buffer the engine does not track.</li>
    <li><strong>The export buffer seesaw.</strong> Each export stream buffers <code>row_group_size × columns</code>. Small slices do nothing for export memory; small row groups blow up the footer. Only cutting both — small objects <em>and</em> small row groups — decouples the seesaw.</li>
    <li><strong>Load memory grows with the table, not the batch.</strong> At <span class="fig">~1.7 B</span> rows loaded, identical load jobs began breaching the memory ceiling and livelocking: merge-on-write delete-bitmap maintenance and wide-table compaction scale with accumulated table size. A watchdog (soft-stop / hard-kill thresholds, atomic aborts, idempotent retries) held the line; dropping to single-stream concurrency resolved it with zero data loss — throughput was export-paced anyway.</li>
  </ul>
  <p>The pipeline that emerged is byte-budget-scheduled, checkpointed per object, safe to kill at any point, and moved <span class="fig">~19,500 rows/s</span> on four backends — about <span class="fig">50×</span> the small-batch alternative on a 3,700-column schema. One result I have not seen published anywhere: on schemas this wide, <strong>column count alone swings write throughput ~5×, while the full correctness stack (merge-on-write dedup, three inverted indexes, ZSTD) costs under 4–12%</strong>. The expensive-looking features are nearly free; the width is the cost.</p>

  <h2>The workload was not what we thought</h2>
  <p>The original serving-table plan was built on a curated 50-query benchmark. Before committing to an irreversible layout, I mined 14 days of production <code>system.query_log</code> — <span class="fig">74.7 M</span> log rows — and the picture inverted: <strong>the overwhelming majority of traffic (well over 90%) was point lookups</strong> keyed on one high-cardinality user identifier, and most of those were unbounded "latest value" reconstructions that no time filter could be retrofitted onto. A second serving table went from "maybe" to mandatory. Designing from the benchmark would have optimized the wrong workload.</p>
  <p>Then the physics lesson. Point lookups on the Iceberg layout ran <span class="fig">7–13 s</span> against ClickHouse's 21 ms. The reflex fix — bloom filters — cut rows scanned by <span class="fig">73%</span> and moved wall-clock time not at all: one active user's rows were scattered across <span class="fig">2,044</span> partition files, and the floor was file-open count, not rows scanned. (We also proved, byte-level, that two common Iceberg writer paths silently ignore declared bloom-filter table properties.) <strong>Indexes cannot fix a layout problem.</strong> The fix was physical re-clustering: a Doris-native table distributed by hash on the user key. Because a distribution key is the one decision you cannot ALTER later, we ran a two-table A/B — same data, mirrored keys, four measurements — before committing. Result: <span class="fig">16–24 ms warm</span>, re-measured at three checkpoints during the live migration (15M → 107M → 286M rows) to prove the latency stays flat as the table grows 19×.</p>

  <h2>Routing is admission control, not performance tuning</h2>
  <p>With serving and analytics on one platform, the &lt;1% of heavy queries had to be caught <strong>before execution</strong> — autoscaling is a minutes-scale mechanism and OOM is a seconds-scale event, so elasticity alone can never be the safety guarantee.</p>
  <p>Stock Doris <code>EXPLAIN</code> routed our production-shaped SQL suite at <span class="fig">45%</span> accuracy with a <span class="fig">27%</span> heavy-miss rate. The decisive observation: identical query templates with different parameters produced byte-identical EXPLAIN text while real memory differed <span class="fig">23×</span> — a signal problem, not a rule problem. The optimizer computes per-operator cardinality, selectivity, and state sizes internally; it just never prints them.</p>
  <p>So I fixed it inside the engine, on an Apache Doris fork:</p>
  <ul>
    <li><strong><code>EXPLAIN ESTIMATE PLAN</code></strong> — a read-only visitor over the finalized physical plan that emits the CBO's existing per-operator estimates as JSON. Purely additive (zero deletions); the mechanism was prepared as an upstream PR.</li>
    <li><strong><code>EXPLAIN ROUTE PLAN</code></strong> — the estimate plus a 15-rule classifier returning a routing verdict in <span class="fig">6–8 ms</span>, independent of data volume. The classifier was ported from a Python reference implementation treated as an executable oracle: <span class="fig">189/189</span> golden-corpus parity before any cluster was involved. All ~21 thresholds are hot-reloadable, so tuning never requires a rebuild.</li>
  </ul>
  <p>One judgment call mattered as much as the code: leadership initially wanted the classifier upstreamed too. I argued the opposite, using the first PR's own principle — the engine should emit data; callers decide policy. The classifier carries our calibrated thresholds and recall-first bias; that is policy, and it stays internal. Knowing what <em>not</em> to contribute changed the plan.</p>
  <p>Heavy recall went <span class="fig">7% → 100%</span> on the canonical suite, and the residual is covered by design: misrouted heavy queries hit a fixed-slot memory hard limit (<span class="fig">~404 MB</span>/query, no overcommit) in the light pool, die within ~3 s, and auto-escalate to the heavy pool. The classifier is <em>allowed</em> to be imperfect because the safety guarantee never depended on it.</p>

  <h2>Two compaction incidents most operators never see</h2>
  <p><strong>The death spiral.</strong> Post-migration, the wide table froze at <span class="fig">~2,500</span> segments per tablet; manual compaction failed silently; cold point queries took 40–68 s. Root cause was three factors multiplied: auto-compaction had been disabled during bulk load, letting debt accumulate until a single task had to merge ~2,506 segments × 3,727 columns (aborted by the memory guard at 43 GB — a task-level abort, not a crash); cloud mode has no peer cache, so every segment was a ~7 s cold S3 read; and the segments were tiny in the first place because a sparse wide schema suffers a <span class="fig">46×</span> compression collapse between the in-memory write buffer and the on-disk segment. We also proved that adding backends was useless before anyone spent money on it: a single tablet's compaction cannot be split across nodes — the logs showed <span class="fig">632</span> no-op wakeups against <span class="fig">9</span> real merges. Concentration-bound, not resource-bound. The verified recipe (auto-compaction always on, 4× larger write buffer, per-month bucket counts to hold tablets at ~10 GB, wider column groups to cut S3 re-scans ~40×) took cold point queries from 40 s to <span class="fig">&lt;100 ms</span> server-side.</p>
  <p><strong>The stuck gauge.</strong> A second incident: compaction score pinned at <span class="fig">~4,500</span>, unmoved by scaling or restarts. Three independent read-only investigation tracks — log enumeration, tablet-meta HTTP endpoints, catalog recycle-bin — converged on the same orphaned tablet from an already-dropped table, structurally excluded from scheduling. One chain of reasoning can be led astray; three independent evidence chains pointing at the same tablet is a verdict. That investigation was executed as parallel AI agents fanned out over the diagnostic surfaces, which is how I run forensics generally now.</p>

  <h2>Elasticity that earns the word</h2>
  <p>The heavy pool rests at zero replicas. The scaler (an internal controller I rebuilt) does exactly one thing: JSON-patch the replica count on the Doris operator's custom resource — an HPA role, nothing more. Its first version deployed backends itself and registered them via SQL; I killed that design before implementation because in cloud mode, anything not declared in the operator's CR gets erased on the next reconcile. When the platform primitive matures, bespoke tooling should shrink.</p>
  <p>The full loop runs live: verdict says heavy → controller patches 0→N → spot node up in <span class="fig">~66 s</span>, backend registered in ~2 min, layered readiness checks (a <code>SELECT 1</code> probe is constant-folded by the frontend and never touches a backend — it will happily report an empty pool as healthy) → query executes → pool reaps to zero. Scaling the serving pool 2→4 backends live moved <strong>zero data</strong> — tablets live in S3, ownership just rebalances. That is the operational dividend of shared-data, captured on a real cluster.</p>

  <h2>What makes the numbers trustworthy</h2>
  <p>Every claim above was measured, and several were retracted on the way. An early benchmark showed Doris beating ClickHouse 3–5× on aggregations; I red-teamed my own result, found the confound (a loaded 8-core production node versus an isolated 14-core benchmark node), and withdrew the multiplier. Public "Doris beats ClickHouse 6–40×" claims all traced back to the vendor; primary-source ClickBench data says ClickHouse still leads flat scans. Migration completeness was certified at <span class="fig">99.945%</span> — 5,170,688,484 of 5,173,508,562 rows — with the 0.055% gap attributed line-by-line to deduplication semantics, and the verification method itself had to be engineered for safety after a naive <code>COUNT(*)</code> audit took down all eight backends.</p>
  <p>The habit underneath all of it: when a number gets less flattering every time you re-measure it, that is usually the sign you are converging on the truth.</p>

  <p class="endnote">Engine-level work referenced here lives on an Apache Doris fork; the mechanism (<code>EXPLAIN ESTIMATE PLAN</code>) was prepared for upstream contribution, the policy layer deliberately kept internal. Names, tenants, and exact identifiers are anonymized; scale figures are rounded.</p>
</article>
</template>

<template id="w-inc-p100-en">
<article>
  <div class="kick eyebrow" style="color:var(--amber)">Incident · Root Cause</div>
  <h1>The P100 That Was Exactly 1.00 Seconds</h1>
  <p class="standfirst">A tail-latency spike that repeated every few minutes, landed on a suspiciously round number, and was invisible in every percentile below P99.</p>
  <div class="tags"><span class="chip">incident response</span><span class="chip">observability</span></div>

  <h2>Symptom</h2>
  <p>One tenant's detection API showed P100 pinned at exactly <span class="fig">1.00 s</span>, spiking every 5–10 minutes. P50 through P95 stayed at a healthy 1–2 ms. Several tenants sharing the same ingress layer were affected in the same windows. Nothing was down; something was periodically stealing exactly one second from the slowest request.</p>

  <h2>Investigation</h2>
  <p>Three lines ran in parallel: access-log/error-log cross-correlation, a full configuration audit of the ingress layer (global config → rendered server config → per-route annotations), and pod-level metrics.</p>
  <p>The first turn: <code>upstream_response_time</code> was normal (20–30 ms) on the slow requests. That exonerated both the upstream service and the client — the wait was happening <em>inside</em> the proxy layer itself.</p>
  <p>The second turn killed the intuitive hypothesis. The config audit found exactly one "1s" anywhere in the rendered configuration, and it was a rate-limiter's sliding-window parameter, not a proxy timeout. The obvious suspect did not exist.</p>
  <p>The decisive evidence came from the error log: the rate-limiting plugin's in-line cache lookups — against a single-replica memcached — were timing out, and every timeout aligned with a slow request's timestamp and client IP. The plugin's client library carries a default read timeout of <span class="fig">1,000 ms</span>. A request that hit a stalled cache lookup waited out the full timeout, then proceeded. Exactly one second, by definition. Supporting signals: the cache was one replica with 10 worker threads, and its file-descriptor count stepped from 24 to 54 as the timeouts began.</p>

  <h2>Fix and what the loop learned</h2>
  <p>The delivered fix plan: scale the cache out of single-replica life, raise its thread pool, and — most importantly — cut the plugin's read timeout from 1,000 ms to 100–200 ms so the worst case degrades to a fast, bounded miss instead of a one-second stall. An exporter went in for the component that had been a monitoring blind spot.</p>
  <blockquote>An integer tail latency is a human constant, not physics. When P100 lands on a round number, search the configs before the graphs.</blockquote>
  <p>That heuristic is now a standing rule in my triage playbook, and the cache layer that hid for years inside a plugin is on a dashboard.</p>
</article>

<template id="w-inc-qps-en">
<article>
  <div class="kick eyebrow" style="color:var(--amber)">Incident · Load Shedding</div>
  <h1>Order of Operations Under Fire</h1>
  <p class="standfirst">A single tenant's traffic surge threatened the shared serving path, the message queue, and the database at once. The fix was less about what to do than about the order in which to do it.</p>
  <div class="tags"><span class="chip">incident response</span><span class="chip">capacity</span></div>

  <h2>Symptom</h2>
  <p>One tenant's query rate spiked far above baseline. Serving latency rose, error rates climbed on the dependency chain, and asynchronous recomputation began competing with the message queue and the database for the same headroom.</p>

  <h2>The sequence, and why it cannot be reordered</h2>
  <ol>
    <li><strong>Stop the bleeding first.</strong> Split traffic 50/50 to a second cluster. Reversible in seconds, buys headroom everywhere downstream, changes no behavior.</li>
    <li><strong>Shed non-critical load second.</strong> Dynamically degrade the non-critical async recomputation — rate-limit it to zero through runtime configuration, no restarts. The system keeps serving its primary contract while background work yields.</li>
    <li><strong>Scale third, with caps.</strong> Serving and async pools scale out under explicit ceilings; the message queue's partitions double; the database scales vertically 2×.</li>
  </ol>
  <p>Scaling first is the intuitive move and the wrong one: adding consumers under uncontrolled inflow feeds the surge directly into the slowest stateful component. The database gets pushed over the cliff by the very capacity that was meant to save it, and capacity added under pressure arrives minutes late to a seconds-scale problem. Shedding before scaling is what makes the scaling safe.</p>

  <h2>Validation discipline</h2>
  <p>Each step had to prove itself before the next: error rate, P95/P99, consumer-lag slope reversal (lag must be <em>falling</em>, flat is not recovery), and database headroom — each with a stability window of at least 10–15 minutes. Rollback criteria were staged in advance, so de-escalation was a checklist, not a judgment call at 2 a.m.</p>
  <blockquote>Under overload, the order of operations is the decision. Everything on the list was correct; done in the wrong order, the same list takes the system down.</blockquote>
</article>
</template>

<template id="w-inc-refused-en">
<article>
  <div class="kick eyebrow" style="color:var(--amber)">Incident · Network Path</div>
  <h1>Refused Is Not Timeout</h1>
  <p class="standfirst">Two words that look like synonyms in an error message cut the diagnostic search space in half before you open a single tool.</p>
  <div class="tags"><span class="chip">incident response</span><span class="chip">kubernetes</span></div>

  <h2>Symptom</h2>
  <p>External connections to a database service failed instantly with <code>connection refused</code>. Instantly is the clue: <em>refused</em> means the packet arrived and nothing was listening — fast and deterministic. <em>Timeout</em> means a listener exists but is not answering. The two words point at different halves of the stack, and conflating them wastes the first hour.</p>

  <h2>Walk the hops, stop at the first failure</h2>
  <p>The path had eight hops: client → DNS → load balancer → NodePort → ingress → Service → Endpoints → pod. The method is unglamorous: verify each hop actually listens or resolves, in order, and stop at the first one that fails. On this class of incident it has produced two different root causes:</p>
  <ul>
    <li><strong>The listener that looked configured.</strong> The ingress controller's TCP-services ConfigMap existed with the right entries — but the controller had never loaded it. Configuration present, listener absent. Everything upstream of the ingress was innocent by inspection.</li>
    <li><strong>The label that went stale.</strong> Subtler: after an abnormal pod restart, the database operator failed to refresh the pod's readiness label. The Service selector required that label, so the Endpoints list was empty — the Service existed, the pod was actually serving, and no traffic could ever arrive. Control-plane truth had diverged from data-plane truth, and only the Endpoints hop showed it.</li>
  </ul>

  <h2>Fix and verify</h2>
  <p>Reload the controller in the first case; restart the workload so the operator re-evaluates its labels in the second. Verification mirrors the diagnosis: confirm the port is actually in a listening state and the Endpoints list is non-empty — the two exact things that were broken, not a generic health check.</p>
  <blockquote>Symptom classification before tooling: refused vs. timeout, then hop by hop. The method is boring, which is why it works at 3 a.m.</blockquote>
</article>
</template>

<template id="w-dr-restore-en">
<article>
  <div class="kick eyebrow" style="color:var(--petrol)">Recovery · Data</div>
  <h1>Restoring 5.2 Billion Rows Without Touching Production</h1>
  <p class="standfirst">A full-scale restore drill that began by proving the original plan was impossible — and ended with a recovery architecture that was provably zero-risk to every live system.</p>
  <div class="tags"><span class="chip">data &amp; state</span><span class="chip">disaster recovery</span></div>

  <h2>Correcting the premise</h2>
  <p>The initial plan assumed rows expired by the database's TTL could be recovered from the live volume. That assumption was wrong, and proving it wrong was the first deliverable: this engine's TTL delete physically unlinks the data parts, and no S3 tiering existed to catch them. Nothing recoverable remained on the live system — and experimenting on a live disk to confirm that would have been risk without payoff.</p>

  <h2>The recovery architecture</h2>
  <p>What did exist was an immutable daily EBS snapshot series of the production volumes. The restore path: materialize a snapshot to a <strong>brand-new, independent volume</strong>, attach it to a <strong>separate database instance</strong>, and verify there. No attach/detach on any live disk, no connection to any production system at any point. The blast radius was not "managed" — it was structurally zero, provable from the design before execution.</p>

  <h2>Verified, with numbers</h2>
  <p>The restored dataset came up live and queryable: <span class="fig">5.198 billion rows / 4.07 TiB</span>. A full <code>count(*)</code> completed in <span class="fig">50 s</span>; a full-table cold aggregation in <span class="fig">83 s</span>. A restore is not a restore until you have queried it — a mounted volume proves storage, not data.</p>

  <h2>Honest boundaries</h2>
  <p>Two limits, named on purpose. The implied RPO is roughly 24 hours — that is what a daily snapshot series gives you, and nobody had written it down as an SLA before this drill made it visible. And this was a one-off drill proving the path works at full scale, not yet a scheduled DR program. Both gaps are now explicit, which is the difference between a gap and a surprise.</p>
  <blockquote>The most useful output of a restore drill is rarely the data. It is the corrected assumptions and the numbers (RPO, restore time) that nobody had been forced to state before.</blockquote>
</article>

<template id="w-cs-doris-cn">
<article>
  <div class="kick eyebrow" style="color:var(--amber)">案例研究 · 精选</div>
  <h1>重构一个 50 亿行、3,700 列的反欺诈事件存储：一路做到引擎里</h1>
  <p class="standfirst">ClickHouse → Apache Doris 存算分离。Infra 侧端到端 owner：引擎选型、迁移流水线、引擎级查询路由、弹性、可观测性。</p>
  <div class="tags"><span class="chip">数据与状态</span><span class="chip">分布式系统</span><span class="chip">平台</span><span class="chip">事故</span></div>

  <h2>一段话版本</h2>
  <p>我们的反欺诈事件层要同时服务两种日益冲突的负载：serving 路径上的毫秒级点查，和越来越多由面向 AI agent 的产品功能（而不是人类分析师）产生的不可预测 ad-hoc 分析。旧的 ClickHouse shared-nothing 层对第二种负载既不能隔离也不能弹性扩容：一条重查询能饿死共享池，我们实测过一条 <code>SELECT * LIMIT 10</code> 排在 bulk insert 后面，墙钟等了 <span class="fig">61 秒</span>、CPU 只用了 <span class="fig">60 毫秒</span>。我做的不是一次迁移。我把这一层重建在存算分离上（Apache Doris shared-data 模式 + Iceberg-on-S3，运行在 Kubernetes 上），并把查询路由做进了 Doris 前端本身：系统在执行前 <span class="fig">6–8 毫秒</span>内给每条查询判轻重，驱动一个 0→N、用完归零的 spot 计算池。迁移对约 <span class="fig">52 亿行 / 4 TiB / 最宽约 3,700 列</span>做了 <span class="fig">99.945%</span> 行级对账认证；点查延迟从<span class="fig">约 8 秒降到约 20 毫秒</span>，并证明在数据增长 19 倍后保持平坦；过程中我根因了一串引擎级故障，从让所有后端在一句 <code>COUNT(*)</code> 上集体 OOM 的 Parquet footer 爆炸，到由 46 倍压缩衰减驱动的 compaction 死亡螺旋。</p>

  <h2>为什么离开 ClickHouse（它当时还更快）</h2>
  <p>在我们决定离开时，ClickHouse 在我们自己的一手 benchmark 上仍以 <span class="fig">1.2–2.5 倍</span>领先平表扫描。迁移的理由是结构性的，而保持这一点需要纪律，因为「新引擎更快」是所有人都想讲、也最经不起盘问的故事。</p>
  <p>四个结构性折中驱动了这个决定：</p>
  <ol>
    <li><strong>没有负载隔离。</strong>一条重查询能饿死共享节点：上面那个 61 秒 / 60 毫秒的饥饿案例是日常，不是特例。</li>
    <li><strong>刚性的常驻计算。</strong>shared-nothing 把计算绑在本地盘上，空闲期和重查询高峰付同一份常驻硬件的钱。ClickHouse 生态里真正无状态的弹性计算只存在于闭源托管服务中；这是架构缺口，不是配置差异。</li>
    <li><strong>脆弱的宽 schema 演进。</strong>每租户 schema 动态演化，落地成数千个稀疏列，靠脆弱的 <code>ALTER ADD COLUMN</code> 维护。</li>
    <li><strong>用采样交正确性税。</strong>分析查询默认只扫 100 万行采样，因为全量太贵：用正确答案换延迟。</li>
  </ol>
  <p>承重论点，也是对最新版 ClickHouse 依然成立的一个，是<strong>硬内存隔离</strong>：Doris 的 workload group 对每个查询池施加 cgroup 级硬限，而 ClickHouse 的对应机制仍是 best-effort。当一个面向 AI agent 的产品层开始以不可预测的频率生成不可预测的查询形状时，隔离与弹性就再也不是可选项。</p>

  <h2>目标架构</h2>
  <p>Doris 4.0.5 shared-data 模式：tablet 数据住在 S3 storage vault，元数据在 FoundationDB 背书的 MetaService，后端是无状态计算，本地 EBS 只当 file cache。计算按 <strong>compute group</strong> 物理分池：常驻 serving 池在 on-demand 节点，弹性重查询池在 spot 上、静息 0 副本。每个池内再用 <strong>workload group</strong> 治理 CPU、内存与并发。同一个 S3 上的 Iceberg 充当开放湖层。</p>
  <p>值得明说的设计洞察：存算分离没有消灭状态，它把状态收拢进一层（MetaService、FoundationDB、S3 recycler），而那一层恰恰是你最不能偷工减料的地方。三个新的有状态故障域取代了「每个节点挂着盘」，下面的运维工作反映的正是这笔交换。</p>

  <h2>迁移是一个内存工程问题</h2>
  <p>约 3,700 列的表会在四个地方打断朴素的「导出 Parquet、批量灌入」路径，没有一个是显然的，而且加硬件一个都治不了：</p>
  <ul>
    <li><strong>Footer 炸弹。</strong>Parquet footer 随 <code>row_groups × columns</code> 增长。早期对象带着 <span class="fig">2.12 GB</span> 的 footer；reader 在碰到任何一行数据之前就 OOM 了全部八台后端。标志性证据：连一句 <code>COUNT(*)</code> 都死了，证明爆炸的是元数据解析而不是数据扫描。重构对象后 footer 降约 9 倍。</li>
    <li><strong>不被追踪的 scanner。</strong>Doris 向量化 Parquet column reader 的内存分配在 <code>exec_mem_limit</code> 之外，规模是 scanner 并发 × 列数；默认配置下约每台后端 <span class="fig">78 GB</span>。任何查询级内存限制都管不住一块引擎不追踪的缓冲。</li>
    <li><strong>导出缓冲的跷跷板。</strong>每条导出流缓冲 <code>row_group_size × columns</code>。切小片救不了导出内存；调小 row group 又会引爆 footer。只有同时切小对象和 row group，跷跷板才解耦。</li>
    <li><strong>导入内存随表增长，而不是随批次。</strong>灌到约 <span class="fig">17 亿行</span>时，完全相同的 load 任务开始冲破内存上限并 livelock：merge-on-write 的 delete-bitmap 维护和宽表 compaction 随累计表大小增长。一个 watchdog（软停/硬杀阈值、原子中止、幂等重试）稳住了局面；降到单流并发后零数据丢失地解决，吞吐本来就受导出节奏限制。</li>
  </ul>
  <p>最终成型的流水线按字节预算调度、逐对象 checkpoint、任何时刻可安全 kill，在四台后端上跑出约 <span class="fig">19,500 rows/s</span>：在 3,700 列 schema 上约为小批方案的 <span class="fig">50 倍</span>。还有一个我没在任何地方见人发表过的结果：在这种宽度的 schema 上，<strong>列宽单独就能让写吞吐摆动约 5 倍，而完整的正确性栈（merge-on-write 去重、三个倒排索引、ZSTD）代价不到 4–12%</strong>。看起来昂贵的特性几乎免费，宽度本身才是成本。</p>

  <h2>负载不是我们以为的样子</h2>
  <p>原本的 serving 表方案建立在一套手挑的 50 条查询 benchmark 上。在承诺一个不可逆的布局之前，我挖了 14 天的生产 <code>system.query_log</code>（<span class="fig">7,470 万</span>行日志），图景整个翻转：<strong>流量的绝大多数（远超九成）是点查</strong>，按一个高基数用户标识键入，其中大多是无界的「最新值」重建，补不上任何时间过滤。第二张 serving 表从「也许」变成硬需求。照着 benchmark 设计，优化的会是错误的负载。</p>
  <p>然后是物理课。Iceberg 布局上的点查跑 <span class="fig">7–13 秒</span>，ClickHouse 是 21 毫秒。反射式的修法（bloom filter）砍掉了 <span class="fig">73%</span> 的扫描行数，墙钟一动不动：一个活跃用户的行散落在 <span class="fig">2,044</span> 个分区文件里，地板是打开文件的数量，不是扫描的行数。（我们还字节级证明了两条常见 Iceberg writer 路径会静默忽略声明的 bloom-filter 表属性。）<strong>索引修不了布局问题。</strong>修法是物理重聚簇：一张按用户键 hash 分布的 Doris 原生表。分布键是唯一日后不能 ALTER 的决策，所以先做了双表 A/B（同一份数据、镜像的两个键、四组测量）再定案。结果：暖读 <span class="fig">16–24 毫秒</span>，并在迁移的三个检查点（1,500 万、1.07 亿、2.86 亿行）重测，证明延迟在表增长 19 倍后保持平坦。</p>

  <h2>路由是准入控制，不是性能调优</h2>
  <p>serving 和分析同平台后，那不到 1% 的重查询必须<strong>在执行前</strong>被拦住：扩容是分钟级机制，OOM 是秒级事件，弹性本身永远当不了安全保证。</p>
  <p>原生 Doris <code>EXPLAIN</code> 在我们生产形状的 SQL 套件上只有 <span class="fig">45%</span> 路由准确率，重查询漏判率 <span class="fig">27%</span>。决定性的观察：同一模板换参数后 EXPLAIN 文本逐字节相同，真实内存却差 <span class="fig">23 倍</span>。这是信号问题，不是规则问题：优化器内部本来就算好了每个算子的基数、选择率和状态大小，只是从不打印。</p>
  <p>于是我在一个 Apache Doris fork 上把它修进引擎：</p>
  <ul>
    <li><strong><code>EXPLAIN ESTIMATE PLAN</code></strong>：一个只读 visitor 遍历定稿的物理计划，把 CBO 已有的算子级估算吐成 JSON。纯加法（零删除），机制部分已准备为 upstream PR。</li>
    <li><strong><code>EXPLAIN ROUTE PLAN</code></strong>：估算加一个 15 规则分类器，<span class="fig">6–8 毫秒</span>返回路由裁决，与数据量无关。分类器从一个被当作可执行 oracle 的 Python 参考实现移植：任何集群介入之前先过 <span class="fig">189/189</span> golden corpus parity。全部约 21 个阈值可热更，调参永不需要重新构建。</li>
  </ul>
  <p>有一个判断和代码同样重要：leadership 起初想把分类器也贡献上游。我用第一个 PR 自己的原则反着论证：引擎应该吐数据，调用方决定策略。分类器携带我们校准的阈值和 recall 优先的偏置，那是策略，应该留在内部。知道什么<em>不该</em>贡献，改变了计划。</p>
  <p>Heavy recall 在标准套件上从 <span class="fig">7% 到 100%</span>，剩余的漏网由设计兜住：误判的重查询在轻池撞上固定槽位内存硬限（约每查询 <span class="fig">404 MB</span>、禁止超卖），约 3 秒内被杀并自动升级到重池。分类器被<em>允许</em>不完美，因为安全保证从不依赖它。</p>

  <h2>两次多数运维者从未见过的 compaction 事故</h2>
  <p><strong>死亡螺旋。</strong>迁移完成后，宽表冻结在每 tablet 约 <span class="fig">2,500</span> 个 segment；手动 compaction 静默失败；冷点查 40–68 秒。根因是三个因素连乘：bulk load 期间关了 auto-compaction，债务堆到单个任务要合并约 2,506 段 × 3,727 列（被内存守卫在 43 GB 处中止，任务级中止而非进程崩溃）；cloud 模式没有 peer cache，每个 segment 都是约 7 秒的 S3 冷读；segment 之所以小，是因为稀疏宽 schema 在内存写缓冲和磁盘 segment 之间有 <span class="fig">46 倍</span>的压缩衰减。我们还在任何人花钱之前证明了加后端无用：单个 tablet 的 compaction 无法跨节点拆分，日志里数出 <span class="fig">632</span> 次空转唤醒对 <span class="fig">9</span> 次真实合并。是集中度受限，不是资源受限。验证过的配方（auto-compaction 常开、写缓冲扩大 4 倍、按月分桶把 tablet 钉在约 10 GB、加宽列组把 S3 重扫削约 40 倍）把冷点查从 40 秒压到服务端 <span class="fig">100 毫秒以内</span>。</p>
  <p><strong>卡死的仪表。</strong>第二次事故：compaction score 钉死在约 <span class="fig">4,500</span>，扩容和重启都无动于衷。三条独立的只读调查线（日志枚举、tablet 元数据 HTTP 端点、catalog 回收站）收敛到同一个孤儿 tablet：来自一张早已 DROP 的表，被结构性排除在调度之外。一条推理链会被带偏；三条独立证据链指向同一个 tablet 就是裁决。那次取证由并行 AI agent 分头扫过各个诊断面执行，这也是我现在跑取证的默认方式。</p>

  <h2>配得上「弹性」这个词的弹性</h2>
  <p>重池静息在零副本。scaler（一个我重建的内部 controller）只做一件事：对 Doris operator 的自定义资源 JSON-patch 副本数，纯 HPA 角色。它的第一版自己部署后端、用 SQL 注册；我在实现前就否掉了那个设计，因为 cloud 模式下任何没在 operator CR 里声明的东西都会被下一次 reconcile 抹掉。平台原语成熟时，自研工具就该收缩。</p>
  <p>全链路真实跑通：裁决判重 → controller patch 0→N → spot 节点约 <span class="fig">66 秒</span>起来、后端约 2 分钟注册、分层就绪检查（<code>SELECT 1</code> 探针会被前端常量折叠、从不触达后端，它会把一个空池报告成健康）→ 查询执行 → 池回收归零。serving 池 live 从 2 台扩到 4 台，<strong>零数据搬迁</strong>：tablet 住在 S3，归属自动再平衡。这就是 shared-data 的运维红利，在真实集群上拍到的。</p>

  <h2>数字凭什么可信</h2>
  <p>上面每个论断都经过测量，其中几个在路上被撤回。早期 benchmark 显示 Doris 聚合赢 ClickHouse 3–5 倍；我 red-team 了自己的结果，找到混淆项（负载中的 8 核生产节点对隔离的 14 核 benchmark 节点），撤回了倍数。公开的「Doris 快 6–40 倍」全部溯源到厂商；一手 ClickBench 数据说 ClickHouse 仍领先平表扫描。迁移完整性认证为 <span class="fig">99.945%</span>（5,170,688,484 / 5,173,508,562 行），0.055% 的差额逐条归因到去重语义，而验证方法本身也得为安全重新设计：一次朴素的 <code>COUNT(*)</code> 对账曾打崩全部八台后端。</p>
  <p>这一切之下的习惯：当一个数字每次重测都变得更不讨喜时，那通常说明你正在逼近真相。</p>

  <p class="endnote">文中的引擎级工作在一个 Apache Doris fork 上；机制（<code>EXPLAIN ESTIMATE PLAN</code>）已准备贡献上游，策略层刻意留在内部。名称、租户与精确标识已匿名化，规模数字取整。</p>
</article>
</template>

  <h2>调查</h2>
  <p>三条线并行：访问日志与错误日志交叉比对、ingress 层配置全量审计（全局配置 → 渲染后的服务配置 → 每路由注解）、pod 级指标。</p>
  <p>第一个转折：慢请求的 <code>upstream_response_time</code> 完全正常（20–30 毫秒）。这同时排除了上游服务和客户端：等待发生在代理层<em>内部</em>。</p>
  <p>第二个转折杀死了直觉假设。配置审计在整个渲染配置里只找到一处「1s」，而它是限流器的滑动窗口参数，不是代理超时。最显然的嫌疑人不存在。</p>
  <p>决定性证据来自错误日志：限流插件的内联缓存查询（对着一个单副本 memcached）在超时，且每次超时都与慢请求的时间戳和客户端 IP 对齐。插件的客户端库默认读超时 <span class="fig">1,000 毫秒</span>。撞上缓存卡顿的请求等完整个超时再继续。恰好一秒，由定义决定。佐证信号：缓存只有一个副本、10 个工作线程，超时开始时它的文件描述符数从 24 跳到 54。</p>

<template id="w-inc-qps-cn">
<article>
  <div class="kick eyebrow" style="color:var(--amber)">事故 · 负载卸除</div>
  <h1>火线上的操作顺序</h1>
  <p class="standfirst">单租户流量激增，同时威胁共享 serving 路径、消息队列和数据库。修复的关键与其说是做什么，不如说是按什么顺序做。</p>
  <div class="tags"><span class="chip">事件响应</span><span class="chip">容量</span></div>

  <h2>症状</h2>
  <p>一个租户的查询量冲到基线之上很远。serving 延迟上升，依赖链错误率攀升，异步重算开始和消息队列、数据库争夺同一份余量。</p>

  <h2>顺序，以及为什么不能重排</h2>
  <ol>
    <li><strong>先止血。</strong>把流量 50/50 切到第二个集群。秒级可逆，为下游所有环节买到余量，不改变任何行为。</li>
    <li><strong>再卸载非关键负载。</strong>动态降级非关键的异步重算：运行时配置把它限流到零，不用重启。系统继续履行主契约，后台工作让路。</li>
    <li><strong>最后带上限扩容。</strong>serving 与异步池在显式上限下扩容；消息队列分区翻倍；数据库垂直扩 2 倍。</li>
  </ol>
  <p>先扩容是直觉动作，也是错误动作：在失控的流入下增加消费者，等于把激增直接喂给最慢的有状态组件。数据库会被本该拯救它的容量推下悬崖，而压力之下追加的容量对秒级问题来说总是晚几分钟。先卸载，扩容才安全。</p>

  <h2>验证纪律</h2>
  <p>每一步都要自证之后才有下一步：错误率、P95/P99、消费积压斜率反转（积压必须在下降，持平不算恢复）、数据库余量，每项至少 10–15 分钟稳定窗口。回滚判据提前分级，降级操作是一张清单，不是凌晨两点的临场判断。</p>
  <blockquote>过载之下，操作顺序就是决策本身。清单上每一项都是对的；顺序错了，同一张清单会把系统放倒。</blockquote>
</article>
</template>

<template id="w-inc-refused-cn">
<article>
  <div class="kick eyebrow" style="color:var(--amber)">事故 · 网络链路</div>
  <h1>refused 不是 timeout</h1>
  <p class="standfirst">错误信息里两个看似同义的词，在你打开任何工具之前就把诊断空间砍掉一半。</p>
  <div class="tags"><span class="chip">事件响应</span><span class="chip">kubernetes</span></div>

  <h2>症状</h2>
  <p>外部连接数据库服务瞬间失败，报 <code>connection refused</code>。「瞬间」就是线索：<em>refused</em> 意味着包到了、没人在听，快速且确定。<em>timeout</em> 意味着有监听者但不应答。两个词指向栈的不同半边，混为一谈会浪费掉第一个小时。</p>

  <h2>逐跳走，停在第一个失败处</h2>
  <p>链路有八跳：client → DNS → 负载均衡 → NodePort → ingress → Service → Endpoints → pod。方法毫无花哨：按序核实每一跳确实在监听或解析，停在第一个失败的跳。在这类事故上，它找到过两个不同的根因：</p>
  <ul>
    <li><strong>看起来配置了的监听者。</strong>ingress controller 的 TCP services ConfigMap 存在且条目正确，但 controller 从未加载它。配置在，监听者不在。ingress 上游的一切当场无罪。</li>
    <li><strong>变陈旧的标签。</strong>更隐蔽：一次异常重启后，数据库 operator 没有刷新 pod 的就绪标签。Service 选择器要求那个标签，于是 Endpoints 是空的：Service 存在、pod 实际在服务，而流量永远到不了。控制面真相偏离了数据面真相，只有 Endpoints 这一跳暴露它。</li>
  </ul>

  <h2>修复与验证</h2>
  <p>第一种情况 reload controller；第二种重启工作负载，让 operator 重新评估标签。验证与诊断互为镜像：确认端口真的处于监听状态、Endpoints 非空。就是坏掉的那两件事，不是一个泛泛的健康检查。</p>
  <blockquote>先分类症状再上工具：refused 还是 timeout，然后逐跳。方法很无聊，所以它在凌晨三点也管用。</blockquote>
</article>
</template>

<template id="w-dr-restore-cn">
<article>
  <div class="kick eyebrow" style="color:var(--petrol)">恢复 · 数据</div>
  <h1>不接触生产，恢复 52 亿行</h1>
  <p class="standfirst">一场从证明原方案不可能开始的全量恢复演练，最终得到一个对所有在线系统可证明零风险的恢复架构。</p>
  <div class="tags"><span class="chip">数据与状态</span><span class="chip">灾备恢复</span></div>

  <h2>纠正前提</h2>
  <p>最初的方案假设被数据库 TTL 过期的行能从在线卷上找回。这个假设是错的，而证明它错就是第一份交付物：这个引擎的 TTL 删除会物理 unlink 数据 part，也不存在能接住它们的 S3 分层。在线系统上没有任何可恢复的东西，而在在线磁盘上做实验来确认这一点，是只有风险没有收益。</p>

  <h2>恢复架构</h2>
  <p>真实存在的是生产卷的不可变每日 EBS 快照序列。恢复路径：把快照物化成一块<strong>全新的独立卷</strong>，挂到一个<strong>独立的数据库实例</strong>上，在那里验证。全程不对任何在线磁盘做 attach/detach，任何时刻不连接任何生产系统。爆炸半径不是「被管理」，而是结构性为零，执行前即可从设计证明。</p>

  <h2>用数字验证</h2>
  <p>恢复出的数据集在线可查：<span class="fig">51.98 亿行 / 4.07 TiB</span>。全量 <code>count(*)</code> 用时 <span class="fig">50 秒</span>；全表冷聚合 <span class="fig">83 秒</span>。没被查询过的恢复不算恢复：挂上的卷证明的是存储，不是数据。</p>

  <h2>诚实的边界</h2>
  <p>两条边界，刻意点名。隐含 RPO 约 24 小时：每日快照序列就给你这么多，而在这次演练之前没人把它写成 SLA。这是一次证明路径可行的一次性演练，还不是有日程的 DR 制度。两个缺口现在都是显式的，这正是「缺口」与「意外」的区别。</p>
  <blockquote>恢复演练最有用的产出很少是数据本身，而是被纠正的假设，和那些此前没人被迫写下的数字（RPO、恢复时长）。</blockquote>
</article>
</template>

             cn:"在 oncall triage harness 里，安全保证从不建立在「模型自觉」上：不可逆操作（删除、scale、drain、IAM）由 shell hook 硬阻断，模型再怎么幻觉也绕不过一个 exit 2。判断交给模型，否决权留给确定性。"}},

var CASES = [{"slug": "apisix-chain-waiting-latency", "domains": ["obs", "platform", "incident"], "title": {"en": "P99 5.9s Spike: The Gateway Metric That Pointed the Wrong Way", "cn": "P99 5.9 秒尖刺：网关指标指错了方向"}, "symptom": {"en": "External API gateway P99 on a large tenant's detection endpoint spiked to 5960ms; the gateway access log showed upstream_response_time=5.022s, which looked like a slow backend.", "cn": "某大租户 detection 接口的外层 API gateway P99 冲到 5960ms，gateway access log 显示 upstream_response_time=5.022s，看上去像后端变慢。"}, "localization": {"en": "Drilled one layer down to the nginx ingress log: request_time=5.016s but true upstream_response_time was only 0.015s, so waiting_duration was 5.001s on a single ingress pod; the serving backend answered in 15ms with 0% errors throughout.", "cn": "下钻到 nginx ingress 层日志：request_time=5.016s 而真实 upstream_response_time 只有 0.015s，即单个 ingress pod 上 waiting_duration 达 5.001s；serving 后端全程 15ms 响应，错误率 0%。"}, "fix": {"en": "Ruled out memcached/Lua timeouts with a clean 90-minute error-log sweep, concluded a transient worker stall on one ingress pod; it self-healed, with a recurrence watch and restart plan left in place.", "cn": "扫了 90 分钟窗口的 error log 排除 memcached/Lua 超时假设，判定为单个 ingress pod 的瞬时 worker 卡顿；已自愈，留下复发监控和重启预案。"}, "lesson": {"en": "An outer gateway's upstream_response_time includes the entire downstream chain, not just the app; always decompose latency layer by layer before blaming the backend.", "cn": "外层网关的 upstream_response_time 包含整条下游链路而不只是应用本身；下结论前必须逐层拆解延迟，不能直接甩锅后端。"}}, {"slug": "asg-node-join-failure", "domains": ["infra", "platform"], "title": {"en": "ASG Scale-Out Nodes That Never Joined the Cluster", "cn": "ASG 扩容节点迟迟进不了集群"}, "symptom": {"en": "Auto Scaling Group scale-out instances either got terminated right after launch, or booted fine but never showed up as Ready Kubernetes nodes, blocking capacity recovery.", "cn": "ASG 扩容出来的实例要么刚启动就被终止，要么能开机但始终没有以 Ready 状态加入 Kubernetes 集群，容量一直恢复不了。"}, "localization": {"en": "Split the problem into two distinct stages with separate evidence paths: instance launch (ASG Activity history, EC2 status checks, Launch Template/AMI) versus cluster join (cloud-init results, journalctl -u kubelet, kubeadm join logs).", "cn": "把问题切成两个证据链完全不同的阶段：实例启动失败（ASG Activity、EC2 状态检查、Launch Template/AMI）和集群加入失败（cloud-init 结果、journalctl -u kubelet、kubeadm join 日志）。"}, "fix": {"en": "Rolled back to a known-good Launch Template/AMI to restore schedulable capacity first, then fixed the join path; user-data encoding mismatch (plaintext vs base64) is the classic pitfall here.", "cn": "先回滚到已知可用的 Launch Template/AMI 恢复可调度容量，再修加入链路；user-data 编码不匹配（明文 vs base64）是这里的经典坑。"}, "lesson": {"en": "Restore capacity before root-causing; \"cannot launch\" and \"cannot join\" are completely different failure paths and must be separated as the first triage decision.", "cn": "先恢复容量再查根因；「起不来」和「加不进」是完全不同的失败路径，triage 第一步就要把两者分开。"}}, {"slug": "clickhouse-connection-refused", "domains": ["platform", "data", "incident"], "link": "w-inc-refused", "title": {"en": "Connection Refused: Eight Hops to Find Where Nobody Was Listening", "cn": "Connection refused：八跳链路上找出没人监听的那一环"}, "symptom": {"en": "External clients got connection refused on ClickHouse's exposed port while the pods themselves looked Running.", "cn": "外部客户端连 ClickHouse 对外端口时报 connection refused，但 pod 本身看起来一切 Running。"}, "localization": {"en": "Walked Client, DNS, NLB, NodePort, ingress-nginx, Service, Endpoints, Process hop by hop; kubectl get endpoints returned <none>: after an abnormal pod restart the operator had left the readiness label at \"no\", so the Service selector matched zero pods.", "cn": "沿 Client、DNS、NLB、NodePort、ingress-nginx、Service、Endpoints、进程逐跳排查；kubectl get endpoints 返回 <none>：pod 异常重启后 operator 没有刷新 readiness label（停在 no），Service selector 匹配不到任何 pod。"}, "fix": {"en": "Rollout-restarted the ClickHouse StatefulSet so the operator re-evaluated and reset the ready label; endpoints repopulated and external connections succeeded again.", "cn": "对 ClickHouse StatefulSet 做 rollout restart，让 operator 重新评估并写回 ready label；endpoints 重新填充，外部连接恢复。"}, "lesson": {"en": "Refused means nothing is listening at some hop, so stop at the first failing hop; operator-managed label gating is a classic way for a Service to silently lose every endpoint.", "cn": "refused 意味着链路上某一跳没人监听，排查应停在第一个失败的跳上；operator 用 label 做 endpoints 门控，是 Service 悄悄失去全部后端的经典方式。"}}, {"slug": "dr-restore-false-failure", "domains": ["data", "platform", "incident"], "link": "w-dr-restore", "title": {"en": "A Cross-Cluster Restore Marked Failed Too Early", "cn": "被过早判死刑的跨集群数据恢复"}, "symptom": {"en": "The cross-cluster ClickHouse recovery workflow (EBS snapshot, PV/PVC swap, restart, validate) was marked failed by the data-copy service, putting a destructive rerun on the table.", "cn": "跨集群 ClickHouse 恢复流程（EBS snapshot、PV/PVC 置换、重启、校验）被数据拷贝服务标记为失败，眼看要触发破坏性重跑。"}, "localization": {"en": "Status API timestamps plus logs showed every stage had completed; probing ClickHouse directly (TCP 9000 open, select 1 succeeds) proved the database had actually recovered, and the automation's pod-ready gate had simply validated before ClickHouse was truly up.", "cn": "status API 时间戳加日志显示各阶段其实都已完成；直接探测 ClickHouse（TCP 9000 可连、select 1 成功）证明数据库已恢复，是自动化用 pod-ready 当就绪门槛，校验跑得太早误判失败。"}, "fix": {"en": "Avoided any destructive rollback or rerun; scaled back up and re-validated after true readiness, then changed the workflow's verification to wait for TCP 9000 plus a real SQL probe before declaring failure.", "cn": "没有执行任何破坏性回滚或重跑；扩容回来等真正就绪后重新校验，并把流程的失败判定改为必须等 TCP 9000 加真实 SQL 探测。"}, "lesson": {"en": "A control-plane \"task failed\" is not a data-plane fact; independently verify the database before acting on any recovery failure, especially when the next step is destructive.", "cn": "控制面的「任务失败」不等于数据面的事实；对恢复类失败必须先独立验证数据库本身，尤其当下一步操作是破坏性的时候。"}}, {"slug": "clickhouse-pod-pending", "domains": ["platform", "infra", "data"], "title": {"en": "The Resource Bump That Could Not Be Scheduled", "cn": "资源翻倍之后，Pod 卡死在 Pending"}, "symptom": {"en": "After raising ClickHouse resources from 2 CPU / 18Gi to 8 CPU / 64Gi, the pod stayed Pending; scheduler events showed Insufficient cpu/memory plus node affinity/selector mismatches.", "cn": "把 ClickHouse 资源从 2 CPU / 18Gi 提到 8 CPU / 64Gi 之后 pod 一直 Pending；调度事件同时报 Insufficient cpu/memory 和 node affinity/selector 不匹配。"}, "localization": {"en": "The dedicated node group (r7i.2xlarge, nominally 8 vCPU / 64GB) only offered about 7.5 CPU / 60Gi allocatable, below the new requests; a larger r7i.4xlarge pool existed but lacked the dedicated-node label required by the strict nodeSelector, so it was never a candidate.", "cn": "专用节点组（r7i.2xlarge，标称 8 vCPU / 64GB）的 allocatable 只有约 7.5 CPU / 60Gi，低于新的 requests；集群里有更大的 r7i.4xlarge 池，但缺少 nodeSelector 要求的专用 label，根本不在候选之列。"}, "fix": {"en": "Created a new dedicated node group on r7i.4xlarge with the dedicated node label preserved in the bootstrap args; the pod scheduled and ran stably.", "cn": "新建了一个 r7i.4xlarge 的专用节点组，并在启动参数里保留原有的专用 label；pod 顺利调度并稳定运行。"}, "lesson": {"en": "The scheduler compares requests against allocatable, which is always below the instance spec, and a strict nodeSelector silently excludes otherwise-fit nodes; a resource bump must be coupled with a node group review.", "cn": "调度器比较的是 requests 和 allocatable，后者永远小于实例标称规格；严格的 nodeSelector 会静默排除本来放得下的节点，加资源必须连带评审节点组。"}}, {"slug": "zombie-tables-oom", "domains": ["data", "incident", "obs"], "link": "w-inc-oom", "title": {"en": "1.21 TiB of Zombie Tables Behind a One-Second OOM", "cn": "1.21 TiB 僵尸表引爆的一秒 OOM"}, "symptom": {"en": "Kafka consumer lag alerts on velocity topics across multiple tenants; ClickHouse inserts were dying with Code 241 \"memory limit exceeded: would use 21.60 GiB\", and failed batches looped through a 30s sleep plus rebalance retry.", "cn": "多个租户的 velocity topic 同时报 Kafka consumer lag；ClickHouse 写入被 Code 241「memory limit exceeded: would use 21.60 GiB」杀掉，失败批次陷入 30 秒 sleep 加 rebalance 的重试循环。"}, "localization": {"en": "system.metric_log's 1-second series showed memory jumping from a ~2 GiB baseline to 21.60 GiB within one second, invisible to 30s Prometheus scrapes; system.tables exposed upgrade-residue zombies, trace_log_2 at 1.21 TiB and processors_profile_log_0 at 308 GiB, whose background merges triggered the spike.", "cn": "system.metric_log 的 1 秒粒度序列显示内存在一秒内从约 2 GiB 基线飙到 21.60 GiB，30 秒的 Prometheus 抓取完全看不见；system.tables 揪出升级残留的僵尸表，trace_log_2 高达 1.21 TiB、processors_profile_log_0 308 GiB，它们的后台 merge 正是尖峰来源。"}, "fix": {"en": "Truncated the active system logs, dropped every _N zombie table (bypassing the 50 GB drop guard), then added TTLs and disabled trace_log in config; a fleet-wide audit found a sibling cluster carrying another 1.65 TiB of the same debt.", "cn": "TRUNCATE 活跃系统日志表，逐个 DROP 所有 _N 僵尸表（绕过 50 GB 删除保护），随后在配置里加 TTL 并禁用 trace_log；全 fleet 巡检又在兄弟集群发现 1.65 TiB 的同类欠账。"}, "lesson": {"en": "ClickHouse upgrades rename old system log tables instead of dropping them; the visible alert (Kafka lag) can be two hops downstream from the real cause, and sub-second memory spikes need 1s-granularity evidence, not scrape-interval dashboards.", "cn": "ClickHouse 升级只重命名旧系统日志表而不删除；看得见的告警（Kafka lag）可能离真凶隔着两跳，而亚秒级内存尖峰必须靠 1 秒粒度证据，抓取间隔级的看板抓不住。"}}, {"slug": "clickhouse-cpu-superposition", "domains": ["data", "obs", "incident"], "title": {"en": "92% CPU: Merges Took the Blame, Full Scans Did the Damage", "cn": "92% CPU：merge 背了锅，真凶是全表扫描"}, "symptom": {"en": "One ClickHouse container pinned at 27.6 of 30 cores (92%) with load average 75.64, while memory sat at 54% and restarts stayed at zero; every other cluster was under 20%.", "cn": "单个 ClickHouse 容器 CPU 钉在 27.6/30 核（92%），load average 高达 75.64，内存只用 54% 且零重启；其他集群全部低于 20%。"}, "localization": {"en": "system.merges alone suggested merge debt, but pairing system.processes with top -H told the real split: 3 concurrent SELECT * full scans reading ~700M rows each consumed 20+ cores (~67%), while TTL/rewrite merges took only ~3 cores (~10%).", "cn": "只看 system.merges 会得出 merge 欠账的结论，但 system.processes 配合 top -H 给出真实占比：3 条并发 SELECT * 全表扫描各读约 7 亿行，吃掉 20+ 核（约 67%），TTL/重写 merge 只占约 3 核（约 10%）。"}, "fix": {"en": "Identified the client issuing the eventId lookup queries; short-term cap max_threads and replace SELECT * with needed columns, long-term add a projection or bloom-filter skip index so eventId lookups stop scanning 700M rows.", "cn": "定位到发起 eventId 查询的调用方；短期压低 max_threads 并把 SELECT * 改成按需列，长期给 eventId 加 projection 或 bloom filter skip index，让点查不再扫 7 亿行。"}, "lesson": {"en": "Never conclude a CPU root cause from system.merges alone; always run both system.processes and the top -H thread breakdown to separate query load from merge load before acting.", "cn": "绝不能只凭 system.merges 给 CPU 定根因；必须同时跑 system.processes 和 top -H 线程分解，把查询负载和 merge 负载拆开再下结论。"}}, {"slug": "cdc-schema-snapshot-sign-null", "domains": ["data", "release", "incident"], "title": {"en": "One DDL Change, Three Cascading CDC Failures", "cn": "一次 DDL 变更引发的 CDC 三连崩"}, "symptom": {"en": "After a release shrank a MySQL table from 4 columns to 2, the CDC connector crashed with \"internal schema size 4, but row size 2\"; post-restart, writes flooded with \"Cannot set null to non-nullable column _sign Int8\".", "cn": "一次发布把 MySQL 表从 4 列改成 2 列后，CDC connector 以「internal schema size 4, but row size 2」崩溃；重启后写入端刷屏「Cannot set null to non-nullable column _sign Int8」。"}, "localization": {"en": "The crash forced a full snapshot in schema-recovery mode; snapshot events carry op_type=r, which the connector never mapped to a _sign value, so ClickHouse's NOT NULL column rejected 23 minutes of writes; a third failure hit the idle standby side, where a network middlebox killed the TCP connection after ~431s, far below MySQL's 8h wait_timeout.", "cn": "崩溃触发 schema recovery 模式下的全量 snapshot；snapshot 事件的 op_type 是 r，connector 从未为它映射 _sign 值，ClickHouse 的 NOT NULL 列拒收了 23 分钟的写入；第三个故障出在空闲的备用侧，网络中间层约 431 秒就掐断 TCP 连接，远小于 MySQL 8 小时的 wait_timeout。"}, "fix": {"en": "The connector self-recovered once the snapshot finished, with the 23-minute rejection window flagged for a data-gap check; prevention: default _sign=1 for snapshot events, plus 30s heartbeats and TCP keepalive to outlive the ~431s idle cutoff.", "cn": "snapshot 完成后 connector 自动恢复，23 分钟被拒窗口列入补数核查；防复发措施：给 snapshot 事件配 _sign 默认值 1，并用 30 秒 heartbeat 加 TCP keepalive 扛过约 431 秒的空闲切断。"}, "lesson": {"en": "DDL changes must be coordinated with CDC connectors, and \"connector recovered\" never means the data is complete; a ~431s timeout signature points at network middleboxes, not the database.", "cn": "DDL 变更必须和 CDC connector 协同，「connector 恢复了」绝不等于数据完整；431 秒量级的超时特征指向网络中间层，而不是数据库本身。"}}, {"slug": "waiting-latency-qps-spike", "domains": ["incident", "platform", "obs"], "title": {"en": "Ingress Queueing Under a Single-Tenant QPS Spike", "cn": "单租户 QPS 尖峰打爆 ingress 排队"}, "symptom": {"en": "Production serving API p95/p99 stayed high for over 10 minutes; ingress request_time was elevated while upstream_response_time held at baseline, and the traffic surge was dominated by one large tenant.", "cn": "生产 serving API 的 p95/p99 持续高位超过 10 分钟；ingress request_time 升高但 upstream_response_time 稳在基线，流量激增由某大租户主导。"}, "localization": {"en": "Latency decomposition (request_time minus upstream_response_time) classified it as waiting_latency dominance, i.e. ingress connection/queue saturation rather than application slowness; per-tenant QPS confirmed single-tenant dominance and ingress saturation signals (connections, CPU, retries) all matched.", "cn": "用 request_time 减 upstream_response_time 做延迟分解，确认 waiting_latency 占主导，即 ingress 连接/队列饱和而非应用变慢；分租户 QPS 证实单租户主导，ingress 饱和信号（连接数、CPU、重试）全部吻合。"}, "fix": {"en": "Applied tenant-aware rate limiting/degradation and distributed traffic to cut the peak, then scaled ingress controller capacity; verified waiting_latency converged back toward upstream_response_time and p95/p99 held at baseline.", "cn": "对该租户做定向限流/降级并分流削峰，再扩 ingress controller 容量；验证 waiting_latency 重新贴近 upstream_response_time，p95/p99 稳定回基线。"}, "lesson": {"en": "Prove waiting_latency dominance before touching the application layer; tenant-dominant spikes need tenant-scoped mitigation, not blanket scaling.", "cn": "动应用层之前先证明是 waiting_latency 主导；单租户主导的尖峰要用租户级手段处置，而不是无差别扩容。"}}, {"slug": "admission-webhook-cabundle", "domains": ["release", "platform", "incident"], "title": {"en": "One Empty caBundle Blocked Every Helm Install in the Cluster", "cn": "一个空 caBundle 卡死全集群 helm install"}, "symptom": {"en": "Multiple tenants' Flink batch jobs failed within the same minute; every helm install carrying an Ingress resource died with \"x509: certificate signed by unknown authority\" from the ingress-nginx admission webhook.", "cn": "多个租户的 Flink batch job 在同一分钟内批量失败；所有含 Ingress 资源的 helm install 都被 ingress-nginx admission webhook 以「x509: certificate signed by unknown authority」拒绝。"}, "localization": {"en": "Diffed the ValidatingWebhookConfiguration's caBundle against the CA in the admission Secret: a recent ingress-nginx helm upgrade had recreated the webhook config without patching the caBundle back, so the apiserver could not verify the webhook's TLS certificate.", "cn": "把 ValidatingWebhookConfiguration 的 caBundle 与 admission Secret 里的 CA 做 diff：近期一次 ingress-nginx helm upgrade 重建了 webhook 配置但没把 caBundle patch 回去，apiserver 因此无法验证 webhook 的 TLS 证书。"}, "fix": {"en": "Patched the CA from the Secret back into the webhook config with a single JSON patch and verified via a server-side dry-run ingress create; long-term, migrate webhook certificates from one-shot helm hooks to cert-manager with rotation.", "cn": "用一条 JSON patch 把 Secret 里的 CA 写回 webhook 配置，并用 server-side dry-run 创建 ingress 验证通过；长期方案是把 webhook 证书从一次性 helm hook 迁到可轮换的 cert-manager。"}, "lesson": {"en": "Many tenants failing through the same mechanism at the same time is a cluster-wide infrastructure signal, not an application bug; \"recent helm upgrade plus webhook failure\" should route straight to change-management triage.", "cn": "多租户同时以同一机制失败，是 cluster 级基础设施信号而非应用 bug；「近期 helm upgrade 加 webhook 失败」应直接路由到变更管理类 triage。"}}, {"slug": "diskpressure-eviction", "domains": ["platform", "infra", "incident"], "title": {"en": "Mass Evictions: Replace the Node Instead of Fighting Image GC", "cn": "批量 Evicted：换节点，别跟镜像 GC 较劲"}, "symptom": {"en": "Large numbers of pods showed Evicted with \"The node had condition: [DiskPressure]\"; node events reported EvictionThresholdMet and ImageGCFailed with 0 bytes eligible to free.", "cn": "大量 pod 变成 Evicted，消息带「The node had condition: [DiskPressure]」；节点事件报 EvictionThresholdMet，且 ImageGCFailed 显示可回收空间为 0 字节。"}, "localization": {"en": "Classified it as kubelet ephemeral-storage eviction rather than app crashes; node checks (df -h / df -i, containerd/kubelet/log directories) confirmed the node could not self-heal because image GC had nothing reclaimable, on a small ~50G root disk hosting large-image workloads.", "cn": "判定为 kubelet 的 ephemeral-storage 驱逐而非应用崩溃；节点级检查（df -h / df -i、containerd/kubelet/日志目录）确认镜像 GC 已无可回收内容，约 50G 的小根盘上还跑着多个大镜像负载，无法自愈。"}, "fix": {"en": "Cordoned and drained the node and let the ASG replace it with a clean instance; prevention: larger root volumes, ephemeral-storage requests/limits, log rotation, and alerts on DiskPressure/ImageGCFailed signals.", "cn": "cordon 加 drain 后交给 ASG 换一台干净的新节点；预防措施包括加大根盘、为写盘负载设 ephemeral-storage requests/limits、日志轮转，以及对 DiskPressure/ImageGCFailed 建告警。"}, "lesson": {"en": "When ImageGCFailed keeps recurring on ASG-managed workers, node replacement beats repeated cleanup; also redact env vars before pasting kubectl describe output into tickets, since it can contain plaintext secrets.", "cn": "ASG 管理的 worker 反复出现 ImageGCFailed 时，换节点优于反复清理；另外 kubectl describe 输出可能含明文密钥，贴进 ticket 前必须脱敏。"}}, {"slug": "kraft-liveness-restart-loop", "domains": ["dist", "platform"], "title": {"en": "The Liveness Probe That Kept Killing Healthy Kafka Brokers", "cn": "反复杀掉健康 Kafka broker 的 liveness probe"}, "symptom": {"en": "Kafka KRaft brokers restarted in rotation with frequent controller re-elections; each restart lined up with \"Liveness probe failed\" events rather than OOMKilled or JVM crashes.", "cn": "Kafka KRaft broker 轮流重启，controller 频繁重新选举；每次重启都与「Liveness probe failed」事件对齐，而非 OOMKilled 或 JVM 崩溃。"}, "localization": {"en": "Ruled out self-crash signals first, then matched restart timestamps to probe failures; the combination of false kills plus controller role flapping identified an over-aggressive livenessProbe killing brokers that were slow but healthy.", "cn": "先排除自身崩溃信号，再把重启时间点和 probe 失败对齐；误杀加 controller 角色反复漂移，指向过于激进的 livenessProbe 在杀慢但健康的 broker。"}, "fix": {"en": "Made liveness conservative (failureThreshold 99, periodSeconds 50, initialDelay 50s) while keeping readiness sensitive for traffic shedding; restarts stopped climbing and the controller stayed stable through the 60-minute observation window.", "cn": "把 liveness 调保守（failureThreshold 99、periodSeconds 50、initialDelay 50s），readiness 保持灵敏用于摘流量；重启计数不再上涨，controller 在 60 分钟观察窗内保持稳定。"}, "lesson": {"en": "For quorum-based stateful systems, liveness probes must be forgiving: readiness sheds traffic but liveness kills, and confusing the two turns slowness into an outage.", "cn": "对基于 quorum 的有状态系统，liveness probe 必须宽容：readiness 只摘流量而 liveness 会直接杀进程，两者混用会把「慢」放大成「挂」。"}}, {"slug": "kafka-lag-parts-explosion", "domains": ["dist", "data", "incident"], "title": {"en": "Kafka Lag That Was Really a ClickHouse Problem", "cn": "看着是 Kafka lag，其实病在 ClickHouse"}, "symptom": {"en": "Consumer group lag ran high across multiple topics simultaneously; ClickHouse logs in the same window showed \"Delaying inserting block by 10 ms because there are 1015 parts\", climbing past 1058 parts.", "cn": "一个 consumer group 在多个 topic 上同时报高 lag；同窗口的 ClickHouse 日志刷「Delaying inserting block by 10 ms because there are 1015 parts」，parts 数一路涨过 1058。"}, "localization": {"en": "Time-correlated the lag spike with ClickHouse insert backpressure; the consumer pods themselves had no OOM, restarts, or throttling, so classified it as a downstream sink bottleneck: a parts explosion throttling inserts and dragging consumer throughput down.", "cn": "把 lag 尖峰与 ClickHouse 写入 backpressure 做时间对齐；消费端 pod 本身无 OOM、无重启、无限流，判定为下游 sink 瓶颈：parts 爆炸导致写入被延迟，拖垮消费吞吐。"}, "fix": {"en": "Restarted the async consumer pods to unstick the pipeline and lag drained back to baseline; follow-ups on parts governance (merge/partition strategy, batch sizing) plus alerts on parts count and insert delay.", "cn": "重启异步消费服务的 pod 解开卡点，lag 回落到基线；后续跟进 parts 治理（merge/分区策略、batch 尺寸）并给 parts 数和写入延迟建告警。"}, "lesson": {"en": "Kafka lag is usually a symptom rather than the disease; the pairing of lag plus \"Delaying inserting block\" should be read as a downstream write bottleneck first, before tuning the consumer.", "cn": "Kafka lag 通常是症状而非病灶；lag 加「Delaying inserting block」这组信号应先按下游写入瓶颈处理，而不是先调消费者。"}}, {"slug": "mirrormaker-partition-ceiling", "domains": ["dist", "data", "incident"], "title": {"en": "Three Partitions Against a Growing Tenant", "cn": "3 个 partition 扛不住持续增长的大租户"}, "symptom": {"en": "Lag alerts fired on a large tenant's velocity topics; dashboards showed cross-cluster replication lag sitting high and draining only slowly, with no errors anywhere.", "cn": "某大租户的 velocity 相关 topic 报 lag 告警；面板显示跨集群复制 lag 高位缓慢消化，全程无任何报错。"}, "localization": {"en": "First split consumer lag from MirrorMaker replication lag via the dedicated mirror-lag dashboard; MirrorMaker pods were healthy (no OOM or restarts), but the tenant's QPS had grown while the topic still had only 3 partitions, capping per-partition mirror throughput.", "cn": "先用 mirror lag 专用面板把消费者 lag 和 MirrorMaker 复制 lag 分开；MirrorMaker pod 资源健康（无 OOM 无重启），但该租户 QPS 上涨而 topic 只有 3 个 partition，单 partition 复制吞吐触顶。"}, "fix": {"en": "No restart needed short-term since lag converged after the traffic peak; long-term: expand topic partitions (irreversible, needs key-distribution and rebalance review), add a dedicated mirror-lag alert, and tie capacity reviews to tenant QPS growth.", "cn": "短期无需重启，波峰过后 lag 自然收敛；长期：扩 topic partition（不可逆，需评估 key 分布与 rebalance 影响）、给 mirror lag 配独立告警、把容量评审与租户 QPS 增长挂钩。"}, "lesson": {"en": "Partition count is a hard ceiling on replication throughput; distinguishing which lag it is, consumer versus mirror, is the mandatory first branch of any Kafka lag triage.", "cn": "partition 数是复制吞吐的硬天花板；分清到底是消费者 lag 还是 mirror lag，是所有 Kafka lag triage 的必答第一题。"}}, {"slug": "tenant-qps-joint-mitigation", "domains": ["incident", "platform", "dist", "data"], "link": "w-inc-qps", "title": {"en": "Degrade First, Scale With Caps: Surviving a Large-Tenant Spike", "cn": "先降级再限额扩容：扛住大租户流量洪峰"}, "symptom": {"en": "A single large tenant's QPS spike degraded the real-time serving path end to end: error rate and p95/p99 climbing, Kafka backlog building, and the database approaching saturation.", "cn": "某大租户的 QPS 尖峰把实时 serving 链路整体拖垮：错误率与 p95/p99 上升，Kafka 积压增长，数据库逼近饱和。"}, "localization": {"en": "Traced the spike's entry path (client, traffic switch, gateway, serving) and confirmed the bottleneck spanned serving pods, async consumers, tenant-scoped Kafka topics, and the database at once, so no single-layer fix would hold.", "cn": "沿入口路径（客户端、流量切换层、网关、serving）追踪尖峰，确认瓶颈同时压在 serving、异步消费、租户专属 Kafka topic 和数据库上，单层修复兜不住。"}, "fix": {"en": "Split traffic 50/50 across paths, zeroed non-critical recompute/backfill rate limits via tenant config with no restart, scaled serving/async HPA within explicit caps (consumer thread pool 40 core / 80 max), doubled the tenant topics' Kafka partitions and temporarily doubled the DB instance size; then stepped the limits back up gradually (0 to 2 to 5 to 10).", "cn": "流量 50/50 分流；通过租户配置在线把非关键的 recompute/backfill 限速清零（无需重启）；在明确上限内扩 serving/异步 HPA（消费线程池 40 核心 / 80 上限）；把该租户 topic 的 Kafka partition 翻倍并临时把 DB 实例规格翻倍；稳定后按 0 到 2 到 5 到 10 逐级恢复限速。"}, "lesson": {"en": "Degrade before you scale: adding serving capacity while the database has no headroom pushes the incident over the edge, and every emergency knob needs an explicit cap plus a written rollback plan.", "cn": "先降级再扩容：数据库没有余量时加 serving 容量只会把事故推下悬崖；每个应急旋钮都要有明确上限和成文的回滚方案。"}}, {"slug": "histogram-skew-false-p99", "domains": ["obs", "incident"], "title": {"en": "The P99 Alert With No Slow Request Behind It", "cn": "背后没有一条慢请求的 P99 告警"}, "symptom": {"en": "A latency alert fired on P99 and the graph looked convincing, but the error rate stayed completely flat in the same window.", "cn": "P99 延迟告警触发，曲线看起来煞有介事，但同窗口错误率完全没有抬头。"}, "localization": {"en": "Checked application logs and APM in the same time window first: zero real slow requests; comparing per-instance histogram buckets and scrape timestamps showed scrape misalignment plus bucket aggregation skew inflating the aggregated P99.", "cn": "先查同时间窗的应用日志与 APM：一条真实慢请求都没有；对比各实例的 histogram bucket 和抓取时间戳，发现抓取时间错位叠加 bucket 聚合偏差，把聚合后的 P99 抬高了。"}, "fix": {"en": "Closed it as a false alert with logs/APM evidence attached, then hardened the rule: added a for: duration, moved percentiles onto recording rules, and aligned scrape timing so the pattern would not re-fire.", "cn": "附上日志/APM 证据按误告警结案，随后加固规则：加 for: 持续时间、把分位数改用 recording rule、对齐抓取时间，杜绝同模式复发。"}, "lesson": {"en": "Before trusting any percentile, disprove it against logs/APM; aggregated histogram quantiles can lie when scrapes misalign across instances, and alert state belongs to the rule engine, not to Slack history.", "cn": "相信任何分位数之前先用日志/APM 证伪；实例间抓取错位时聚合的 histogram 分位数会说谎，而告警状态以规则引擎为准，不以 Slack 消息记录为准。"}}, {"slug": "mysql-timeout-node-dns", "domains": ["platform", "infra", "incident"], "title": {"en": "MySQL Timeouts That Followed One Worker Node Around", "cn": "跟着某个 worker 节点走的 MySQL 超时"}, "symptom": {"en": "Serving pods logged MySQL \"connect timed out\" while MySQL itself was perfectly healthy; the failures clustered on pods scheduled to one specific worker node.", "cn": "serving 服务的 pod 日志报 MySQL「connect timed out」，但 MySQL 自身完全健康；失败集中在调度到某个特定 worker 节点上的 pod。"}, "localization": {"en": "First separated timeout from refused/auth errors, verified Service/Endpoints and the actual destination (Service DNS versus a NodePort-style path), then compared DNS and TCP probes from failing versus healthy pods: only pods on the one node failed, indicating node-level DNS/egress breakage.", "cn": "先把 timeout 与 refused/认证类错误分开，核对 Service/Endpoints 和实际目标地址（Service DNS 还是 NodePort 类路径），再在故障 pod 与健康 pod 内对比 DNS 与 TCP 探测：只有那台节点上的 pod 失败，指向节点级 DNS/出网故障。"}, "fix": {"en": "Restarted the serving deployment so pods rescheduled off the suspect node and the timeouts stopped without touching MySQL at all; cordoned the node and handed it to the network owner for root cause.", "cn": "重启 serving deployment 让 pod 调度离开可疑节点，完全没动 MySQL 超时就消失；随后 cordon 该节点并移交网络负责人查根因。"}, "lesson": {"en": "When connection failures are concentrated on one node, treat it as node-level DNS/egress breakage: move the workload first to stop the bleeding, then chase the node.", "cn": "连接失败集中在单节点时，按节点级 DNS/出网故障处理：先迁走负载止血，再回头追那台节点的根因。"}}, {"slug": "memcached-p100-1s", "domains": ["incident", "platform", "obs"], "link": "w-inc-p100", "title": {"en": "Why P100 Landed on Exactly 1.00s Every Few Minutes", "cn": "P100 为什么每隔几分钟正好停在 1.00 秒"}, "symptom": {"en": "Ingress waiting-latency P100 spiked to exactly 1.00s every 5-10 minutes while P50-P95 stayed at 1-2ms and upstream_response_time never moved from ~20-30ms; the top client accounted for 47.5% of affected requests.", "cn": "ingress waiting latency 的 P100 每 5 到 10 分钟精准冲到 1.00 秒，P50 到 P95 稳在 1 至 2ms，upstream_response_time 始终在约 20 至 30ms；受影响请求中头部客户占 47.5%。"}, "localization": {"en": "Cross-correlated slow access-log entries with error-log lines on second plus client IP: the rate-limit Lua plugin's synchronous memcached call was timing out; memcached ran as a single replica with 10 threads, file descriptors jumping 24 to 54 at spike time, and the 1.00s ceiling was exactly the Lua read timeout (1000ms, connect timeout 50ms).", "cn": "按秒级时间戳加客户端 IP 把慢请求 access log 与 error log 交叉对齐：限流 Lua 插件对 memcached 的同步调用在超时；memcached 单副本仅 10 线程，尖峰时刻文件描述符从 24 跳到 54，而 1.00 秒的天花板正是 Lua 读超时常量（1000ms，连接超时 50ms）。"}, "fix": {"en": "Mitigation plan: scale memcached replicas and raise threads from 10 to 32+, lower the Lua read timeout to 100-200ms to bound worst-case waiting, add a memcached exporter for connection visibility, and retire the deprecated image.", "cn": "缓解方案：memcached 扩副本并把线程从 10 提到 32+，Lua 读超时降到 100 至 200ms 以封顶最坏等待，加 memcached exporter 补上连接数可见性，并替换已弃用的镜像。"}, "lesson": {"en": "A suspiciously exact latency plateau is a timeout constant, not randomness; hunting down which config owns that number leads straight to the root cause.", "cn": "延迟精确卡在某个整数上不是巧合而是某个超时常量；追问「这个数字写在哪个配置里」就能直达根因。"}}, {"slug": "qa-disk-cleanup-failure", "domains": ["platform", "data", "incident"], "title": {"en": "The Deployment That Would Not Recover After a Disk Cleanup", "cn": "磁盘清理之后再也起不来的部署"}, "symptom": {"en": "A QA/Dev deployment failed with pods in CrashLoopBackOff and dependencies unavailable, shortly after a disk cleanup/reclaim cycle had run in the environment.", "cn": "QA/Dev 环境的部署失败，pod 反复 CrashLoopBackOff、依赖不可用，时间点紧跟一轮磁盘清理/回收任务之后。"}, "localization": {"en": "Proved the cleanup window overlapped the failure first, then used events and logs to find the first broken dependency in the chain: the storage/DB layer, not the upper-layer services that were visibly failing.", "cn": "先证明清理窗口与故障窗口重叠，再顺着 events 和日志找链条上第一个断掉的依赖：是底层存储/数据库，而不是表面上在报错的上层服务。"}, "fix": {"en": "Restored the database dependency first, then rebuilt the upper-layer services (BI/analytics UI) in strict dependency order and verified readiness; filed follow-ups to add retention guardrails to the cleanup job.", "cn": "先恢复数据库依赖，再按依赖顺序重建上层服务（BI/分析 UI）并验证就绪；跟进给清理任务加保留策略护栏防复发。"}, "lesson": {"en": "Fix in dependency order from the bottom up; the loudest failing component is rarely the first one that broke.", "cn": "按依赖顺序自底向上修复；叫得最响的组件，往往不是最先坏掉的那个。"}}, {"slug": "spark-job-stuck-pending", "domains": ["data", "platform", "incident"], "title": {"en": "Spark Jobs That Never Reached Running", "cn": "永远到不了 Running 的 Spark 任务"}, "symptom": {"en": "Spark/Luigi jobs sat in Pending, Init, or Terminating without ever reaching Running, holding cluster resources hostage and blocking the next scheduled runs.", "cn": "Spark/Luigi 任务卡在 Pending、Init 或 Terminating，始终到不了 Running，占着集群资源并堵住后续排程。"}, "localization": {"en": "Extracted the job_id from the alert (often the namespace suffix), confirmed the stuck pods in Kubernetes, then judged blast radius: one or two stuck jobs versus broadly unhealthy scheduling, which decides whether the worker pool itself needs recycling.", "cn": "从告警里提取 job_id（通常是 namespace 后缀），在 Kubernetes 里确认卡住的 pod，再判断爆炸半径：是个别任务卡住，还是调度整体不健康，这决定要不要动 worker 池。"}, "fix": {"en": "Terminated the stuck jobs through the cluster-manager API to release resources; when scheduling was broadly unhealthy, recycled the shared worker pool (scale to 0 then back to 50 replicas), but only after confirming no healthy jobs were in flight, and verified cleanup after every step.", "cn": "通过集群管理 API 终止卡住的任务释放资源；调度整体不健康时再回收共享 worker 池（缩到 0 再扩回 50 副本），且必须先确认没有健康任务在跑，每一步操作后都做清理验证。"}, "lesson": {"en": "Verify after every mutating step, and never recycle a shared worker pool without first proving nothing healthy is running in it.", "cn": "每个写操作之后必须验证；没有先证明池里没有健康任务在跑，绝不回收共享 worker 池。"}}, {"slug": "olap-fe-crashloop-ip-binding", "domains": ["data", "platform", "dist"], "title": {"en": "285 Restarts and an Empty kubectl logs", "cn": "285 次重启，kubectl logs 却一片空白"}, "symptom": {"en": "Another OLAP engine's frontend StatefulSet pod racked up 285 restarts in CrashLoopBackOff with exit code 143, while kubectl logs returned nothing at all.", "cn": "另一款 OLAP 引擎的 frontend StatefulSet pod 累计重启 285 次，CrashLoopBackOff，退出码 143，而 kubectl logs 输出完全为空。"}, "localization": {"en": "Exec'd into the container to read the file-only frontend log: BerkeleyDB metadata persisted on the PVC had recorded the old pod IP; after restart the pod got a new IP, so the node stayed in UNKNOWN role, never opened port 9030, and the liveness probe killed it every 60 seconds in a loop.", "cn": "exec 进容器读只写文件的 frontend 日志：PVC 上持久化的 BerkeleyDB 元数据记着旧 pod IP，重启后 pod 拿到新 IP，节点角色停在 UNKNOWN，9030 端口始终不开，liveness probe 每 60 秒杀一次，循环往复。"}, "fix": {"en": "Short-term: scale down, delete the PVC to wipe the stale metadata, scale up to reinitialize; permanent: switch to a headless Service plus FQDN host type so metadata records stable DNS names instead of ephemeral pod IPs.", "cn": "短期：缩容、删 PVC 清掉过期元数据、再扩容重新初始化；永久：改用 headless Service 并以 FQDN 作为节点标识，让元数据记录稳定的 DNS 名而非易变的 pod IP。"}, "lesson": {"en": "An empty kubectl logs does not mean no logs exist, some engines only write to files inside the container; and registering cluster members by IP inside Kubernetes is a design bug, because pod IPs are ephemeral.", "cn": "kubectl logs 为空不代表没有日志，有些引擎只往容器内文件写；而在 Kubernetes 里用 IP 注册集群成员本身就是设计缺陷，因为 pod IP 天生易变。"}}];

function writingById(id){ for (var i=0;i<WRITINGS.length;i++) if (WRITINGS[i].id===id) return WRITINGS[i]; return null; }
function domainsCiting(wid){
  var out=[];
  DOMAINS.forEach(function(d){ d.evidence.forEach(function(e){ if(e.w===wid && out.indexOf(d)<0) out.push(d); }); });
  return out;
}
function P(rest){ return "#/"+LANG+(rest||""); }
/* Articles live on the blog. W() returns the outbound URL for an id. */
function W(id){ var w=writingById(id); return (w && w.url && (w.url[LANG]||w.url.en)) || ""; }
function isExt(u){ return /^https?:/.test(u||""); }
/* timeline monogram: shrink the type when the label is an acronym rather than 1-2 letters */
function tile(t){
  t = T(t) || "·";
  var n = String(t).length;
  // camel-case wordmarks get a soft wrap point so they break as Byte|Dance, not Bytedanc|e
  return '<div class="tl-tile'+(n>4 ? " word" : (n>2 ? " sm" : ""))+'">'+esc(t).replace(/([a-z])([A-Z])/g,"$1<wbr>$2")+'</div>';
}

/* ---------- radar svg ---------- */
function radarSVG(){
  var cx=225, cy=195, R=138, n=DOMAINS.length;
  function pt(i, r){
    var a = -Math.PI/2 + i*2*Math.PI/n;
    return [cx + r*Math.cos(a), cy + r*Math.sin(a)];
  }
  function ring(frac){
    var p=[]; for(var i=0;i<n;i++){ p.push(pt(i,R*frac).map(function(v){return v.toFixed(1);}).join(",")); }
    return '<polygon points="'+p.join(" ")+'" fill="none" stroke="var(--line-soft)" stroke-width="1"/>';
  }
  var s='<svg viewBox="0 0 450 400" role="img" aria-label="Competency radar" style="width:100%;height:auto;display:block">';
  s+=ring(.25)+ring(.5)+ring(.75)+ring(1);
  for(var i=0;i<n;i++){ var e=pt(i,R); s+='<line x1="'+cx+'" y1="'+cy+'" x2="'+e[0].toFixed(1)+'" y2="'+e[1].toFixed(1)+'" stroke="var(--line-soft)" stroke-width="1"/>'; }
  var dp=[], tp=[];
  for(var j=0;j<n;j++){
    dp.push(pt(j, R*DOMAINS[j].depth/100).map(function(v){return v.toFixed(1);}).join(","));
    tp.push(pt(j, R*DOMAINS[j].target/100).map(function(v){return v.toFixed(1);}).join(","));
  }
  s+='<polygon points="'+tp.join(" ")+'" fill="none" stroke="var(--muted)" stroke-width="1.2" stroke-dasharray="4 4"/>';
  s+='<polygon points="'+dp.join(" ")+'" fill="var(--amber-soft)" stroke="var(--amber)" stroke-width="2"/>';
  for(var k=0;k<n;k++){
    var d=DOMAINS[k], v=pt(k, R*d.depth/100);
    s+='<circle cx="'+v[0].toFixed(1)+'" cy="'+v[1].toFixed(1)+'" r="3" fill="'+(GROUPS[d.group].tone==="cool"?"var(--petrol)":"var(--amber)")+'"/>';
    var L=pt(k, R+26), anchor = Math.abs(L[0]-cx)<12 ? "middle" : (L[0]>cx ? "start":"end");
    var lines=T(d.axis), ly=L[1]-(lines.length-1)*6.5;
    s+='<g class="axisLabel" data-d="'+d.id+'" role="link" tabindex="0" aria-label="'+esc(T(d.name))+'">';
    for(var m=0;m<lines.length;m++){
      s+='<text x="'+L[0].toFixed(1)+'" y="'+(ly+m*13).toFixed(1)+'" text-anchor="'+anchor+'">'+esc(lines[m])+'</text>';
    }
    s+='<text class="val mono" x="'+L[0].toFixed(1)+'" y="'+(ly+lines.length*13+1).toFixed(1)+'" text-anchor="'+anchor+'">'+d.depth+'</text>';
    s+='</g>';
  }
  s+='</svg>';
  return s;
}

    /* writing list removed 2026-08-04: it lived here and on the landing page; the landing page wins */

  h+='<nav class="crumb mono" style="display:flex;gap:12px;align-items:baseline"><a href="'+P("")+'">'+esc(T(UI.crumbMap))+'</a>'+langSwitch("/d/"+id)+'</nav>';
  h+='<div class="eyebrow" style="color:'+col+'">'+esc(T(GROUPS[d.group].label))+'</div>';
  h+='<h1>'+esc(T(d.name))+'</h1>';
  h+='<div class="dmeta mono">'+esc(T(UI.depth))+' '+d.depth+' · '+esc(T(UI.target))+' '+d.target+'</div>';
  h+='<p class="dtag">'+esc(T(d.tagline))+'</p>';
  h+='<div class="thinkbox'+(cool?' cool':'')+'"><div class="lb eyebrow" style="color:'+col+'">'+esc(T(UI.think))+'</div><h3>'+esc(T(d.thinking.title))+'</h3><p>'+esc(T(d.thinking.body))+'</p></div>';
  h+='<div class="sec-label">'+esc(T(UI.skillsHead))+'</div><div class="chips">';
  T(d.skills).forEach(function(s){ h+='<span class="chip">'+esc(s)+'</span>'; });
  h+='</div>';
  if(d.track){
    h+='<div class="sec-label">'+esc(T(UI.trackHead))+'</div>';
    h+='<p class="track-line">'+esc(T(d.track))+'</p>';
    h+='<p class="track-note">'+esc(T(UI.trackNote))+'</p>';
    var dcases=CASES.filter(function(c){return c.domains && c.domains.indexOf(d.id)>=0;});
    if(dcases.length){
      var LB = LANG==="cn" ? {s:"症状",l:"定位",f:"修复",e:"教训",r:"完整长文 →"} : {s:"Symptom",l:"Localization",f:"Fix",e:"Lesson",r:"Full write-up →"};

        h+='<p><b>'+LB.s+'</b> · '+esc(T(c.symptom))+'</p>';
        h+='<p><b>'+LB.l+'</b> · '+esc(T(c.localization))+'</p>';
        h+='<p><b>'+LB.f+'</b> · '+esc(T(c.fix))+'</p>';
        h+='<p><b>'+LB.e+'</b> · '+esc(T(c.lesson))+'</p>';
        if(c.link){ h+='<p class="cse-link mono"><a href="'+W(c.link)+'" target="_blank" rel="noopener">'+LB.r+'</a></p>'; }

      });

  if(d.itable){
    h+='<details class="deep"><summary>'+esc(T(d.itable.title))+'</summary><div class="inner itable-wrap"><table class="itable"><thead><tr>';

    h+='</tr></thead><tbody>';

  var w=writingById(id), tpl=document.getElementById(id+"-"+LANG) || document.getElementById(id+"-en");
  if(!w||!tpl) return viewHome();
  var h='<nav class="crumb mono" style="display:flex;gap:12px;align-items:baseline"><a href="'+P("")+'">'+esc(T(UI.crumbMap))+'</a>'+langSwitch("/w/"+id)+'</nav>';
  h+=tpl.innerHTML;
  var cites=domainsCiting(id);
  if(cites.length){
    h+='<div class="sec-label" style="max-width:70ch">'+esc(T(UI.citedBy))+'</div><div class="chips" style="max-width:70ch">';

  }
  h+='<p class="backline mono"><a href="'+P("")+'">'+esc(T(UI.backMap))+'</a></p>';

/* ---------- router ---------- */
function detectLang(){
  try{
    var saved = localStorage.getItem("resume-lang");
    if(saved==="en"||saved==="cn") return saved;
  }catch(e){}
  return (navigator.language||"").toLowerCase().indexOf("zh")===0 ? "cn" : "en";
}

function render(){
  var app=document.getElementById("app");
  var hash=location.hash||"";
  var m=hash.match(/^#\/(en|cn)(?:\/(d|w)\/([\w-]+))?/);
  if(!m){ location.replace("#/"+detectLang()); return; }
  LANG=m[1];
  try{ localStorage.setItem("resume-lang", LANG); }catch(e){}
  document.documentElement.lang = (LANG==="cn"?"zh-CN":"en");
  document.title = T(UI.title);
  if(m[2]==="d") app.innerHTML=viewDomain(m[3]);
  else if(m[2]==="w"){ var u=W(m[3]); if(u){ location.replace(u); return; } app.innerHTML=viewHome(); }
  else app.innerHTML=viewHome();
  window.scrollTo(0,0);
  app.querySelectorAll(".axisLabel").forEach(function(g){
    function go(){ location.hash=P("/d/"+g.getAttribute("data-d")); }
    g.addEventListener("click",go);
    g.addEventListener("keydown",function(ev){ if(ev.key==="Enter"||ev.key===" "){ ev.preventDefault(); go(); } });
  });
}
window.addEventListener("hashchange",render);
render();
